services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: clojure_pds
      POSTGRES_USER: pds
      POSTGRES_PASSWORD: ${PDS_DATABASE_PASSWORD:?Set PDS_DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pds -d clojure_pds"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
