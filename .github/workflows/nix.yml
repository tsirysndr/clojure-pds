name: nix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: nix build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Build the launcher
        run: nix build .#clojure-pds --print-build-logs

      - name: Check the launcher applies migrations to a temporary database
        run: |
          test -x result/bin/clojure-pds
          # Migrating a throwaway SQLite file exercises the wrapper, the
          # classpath, dependency resolution and the schema in one step, and
          # proves data is written outside the read-only store.
          PDS_SQLITE_PATH="$(mktemp -d)/pds.sqlite3"
          export PDS_SQLITE_PATH
          ./result/bin/clojure-pds migrate | tee migrate.log
          grep -q "SQLite migrations applied" migrate.log
          test -f "$PDS_SQLITE_PATH"

      - name: Check the development shell
        run: nix develop --command clojure --version
